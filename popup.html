<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Invite All</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28" />
    <div>
      <h1>Invite All</h1>
      <p class="sub">for Facebook events</p>
    </div>
  </header>

  <section id="not-fb" hidden>
    <p class="empty">Open your event on Facebook, click <b>Invite</b>, then come back here.</p>
  </section>

  <section id="main" hidden>
    <div class="status" id="status-line">
      <span class="dot"></span><span id="status-text">Checking…</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="selected">0</span><span class="lbl">selected</span></div>
      <div class="stat"><span class="num" id="left">—</span><span class="lbl">invites left</span></div>
    </div>
    <p class="msg" id="msg"></p>
    <button id="go" class="go">Select all</button>
  </section>

  <details id="settings">
    <summary>Settings</summary>
    <label>Delay between clicks (ms)<input type="number" id="clickDelay" min="0" max="2000" step="5" /></label>
    <label>Max wait for loading (ms)<input type="number" id="loadTimeout" min="1000" max="30000" step="500" /></label>
    <label>Failed loads before stopping<input type="number" id="idleRounds" min="1" max="10" step="1" /></label>
    <label>Max to select (0 = no limit)<input type="number" id="maxSelect" min="0" step="1" /></label>
    <label class="check"><input type="checkbox" id="showPanel" />Show floating panel next to the invite dialog</label>
    <button id="reset" class="link">Reset to defaults</button>
  </details>

  <footer>Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>I</kbd></footer>
  <script src="popup.js"></script>
</body>
</html>
